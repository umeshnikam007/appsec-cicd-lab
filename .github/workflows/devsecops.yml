
name: AppSec Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  
jobs:
  security-scans:
    name: Secrets, SAST and SCA
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Secrets scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 3. SAST - Semgrep
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep SAST
        run: |
          mkdir -p reports
          semgrep scan --config auto \
            --sarif \
            --output reports/semgrep.sarif \
            . 
        continue-on-error: true

      # 4. Setup application
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 5. SCA - npm audit
      - name: Run npm audit
        run: |
          npm audit --audit-level=high \
            --json > reports/npm-audit.json
        continue-on-error: true

      # 6. SCA - Trivy
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: reports/trivy.json
          exit-code: '0'
        continue-on-error: true

      # 8. Upload security reports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            reports/
          if-no-files-found: warn

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: security-scans
    if: always()

    steps:
      # 9. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 10. Start application
      - name: Start application
        run: |
          npm start > app.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:3000 \
              > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          cat app.log
          exit 1

      # 11. DAST - ZAP
      - name: Run OWASP ZAP Baseline
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

          docker run --rm \
            --network host \
            -v "${PWD}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      # 12. Upload DAST report
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-reports/
          if-no-files-found: warn
